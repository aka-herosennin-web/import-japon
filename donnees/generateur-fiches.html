<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Générateur de fiches import</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f4f3ef;--surface:#fff;--ink:#1d1d1f;--muted:#62666b;--line:#dedbd4;--accent:#c0392b;--accent-ink:#fff;
--ok:#1e7a46;--ok-bg:#e8f5ed;--ko:#9a3412;--ko-bg:#fdeee6;--warn:#8a5a00;--warn-bg:#fff6e0;--field:#fbfaf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--surface:#1c1c1d;--ink:#f1f1f1;--muted:#a1a1a1;--line:#343434;
--accent:#e2574c;--ok:#4ade80;--ok-bg:#15291d;--ko:#fb923c;--ko-bg:#2d1c12;--warn:#f5c451;--warn-bg:#2a2414;--field:#232324}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:1.05rem;margin:0}
header h1 span{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px}
button,.btnlike{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 11px;border-radius:9px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button.danger{color:var(--ko)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px 16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.list{display:flex;flex-direction:column;gap:6px}
.item{text-align:left;border-radius:10px;padding:8px 10px;width:100%}
.item[aria-current=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.item small{display:block;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:6px;margin-top:3px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.draft{background:var(--warn-bg);color:var(--warn)}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0 0 12px}
legend{font-weight:600;font-size:.9rem;padding:0 6px}
label{display:block;font-size:.84rem;color:var(--muted);margin:8px 0 3px}
input[type=text],input[type=url],input[type=date],select,textarea{width:100%;font:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:92px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}
.checks label{display:flex;gap:5px;align-items:center;margin:0;color:var(--ink);font-size:.88rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:3px}
.msg{font-size:.84rem;border-radius:8px;padding:7px 10px;margin-top:6px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.ko{background:var(--ko-bg);color:var(--ko)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
.checklist{list-style:none;padding:0;margin:0 0 10px;font-size:.86rem}
.checklist li{padding:3px 0}
.checklist li::before{content:"✗ ";color:var(--ko);font-weight:700}
.checklist li.done::before{content:"✓ ";color:var(--ok)}
iframe{width:100%;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--line);border-radius:12px;background:#fff}
.previewcol{align-self:stretch}.stickybox{position:sticky;top:66px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:460px;width:calc(100% - 32px)}
@media (max-width:1100px){.layout{grid-template-columns:220px minmax(0,1fr)}.previewcol{grid-column:1/-1}.stickybox{position:static}iframe{height:640px}}
@media (max-width:720px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Générateur de fiches import<span>.</span></h1>
  <div class="bar">
    <button id="bNew">+ Nouvelle fiche</button>
    <button id="bSettings">Réglages</button>
    <button id="bExportJson">Sauvegarder (JSON)</button>
    <label class="btnlike" style="margin:0">Importer<input id="fImport" type="file" accept="application/json" hidden></label>
    <button id="bExportSite" class="primary">Exporter le site (.zip)</button>
  </div>
</header>

<div class="layout">
  <aside class="panel">
    <h2>Fiches</h2>
    <div class="list" id="list"></div>
  </aside>

  <main class="panel">
    <h2>Édition</h2>
    <form id="form" autocomplete="off">
      <fieldset><legend>Jeu et édition</legend>
        <label for="type">Type de produit</label><select id="type"><option value="jeu">Jeu vidéo</option><option value="materiel">Matériel (console, PC portable…)</option><option value="collection">Carte / objet de collection</option></select>
        <label for="titre">Titre</label><input id="titre" type="text" placeholder="Légendes Pokémon : Arceus">
        <div class="row">
          <div><label for="edition">Édition</label><input id="edition" type="text" placeholder="Édition japonaise multilingue"></div>
          <div><label for="console">Console</label>
            <select id="console"><option>Nintendo Switch</option><option>Nintendo Switch 2</option><option>PlayStation 5</option><option>PlayStation 4</option><option>Nintendo 3DS</option><option>Xbox Series X|S</option><option>PlayStation 3</option><option>PlayStation 2</option><option>PlayStation</option><option>Super Famicom</option><option>PC-Engine</option><option>PC (Windows)</option><option>Matériel / autre</option><option>Autre</option></select></div>
        </div>
        <div class="row">
          <div><label for="region">Région de l'édition</label>
            <select id="region"><option>Japon</option><option>Asie</option><option>Hong Kong</option><option>Corée du Sud</option><option>Taïwan</option><option>États-Unis</option><option>Europe</option><option>Autre</option></select></div>
          <div><label for="format">Format</label>
            <select id="format"><option value="nv">Non vérifié</option><option value="np">Non précisé par Play-Asia</option><option value="physique">Physique (cartouche / disque)</option><option value="gamekey">Game-Key Card (cartouche-clé, jeu à télécharger)</option><option value="code">Code numérique</option></select></div>
        </div>
      </fieldset>

      <fieldset><legend>Lien affilié Play-Asia</legend>
        <label for="url">Lien copié depuis ton espace affilié</label>
        <input id="url" type="url" placeholder="https://www.play-asia.com/...?affiliate_id=971294">
        <div id="urlMsg"></div>
      </fieldset>

      <fieldset><legend>Langues (vérifiées)</legend>
        <div class="checks" id="langs"></div>
        <label for="languesAutres">Autres langues</label><input id="languesAutres" type="text" placeholder="Coréen, cantonais…">
        <label for="voix">Langues des voix (si indiquées)</label><input id="voix" type="text" placeholder="Japonais, anglais">
        <label for="languesSource">Source des langues (URL)</label><input id="languesSource" type="url" placeholder="Fiche Play-Asia ou page officielle">
      </fieldset>

      <fieldset><legend>Compatibilité (vérifiée)</legend>
        <div class="row">
          <div><label for="compat">Fonctionne sur une console européenne</label>
            <select id="compat"><option value="nv">Non vérifié</option><option value="np">Non précisé / ambigu sur la fiche</option><option value="oui">Oui</option><option value="non">Non (zonée)</option></select></div>
          <div><label for="switch2">Fonctionne sur Switch 2</label>
            <select id="switch2"><option value="na">Sans objet</option><option value="nv">Non vérifié</option><option value="oui">Oui</option><option value="non">Non</option></select></div>
        </div>
        <label for="compatTexte">Précision (facultatif)</label><input id="compatTexte" type="text" placeholder="Ex. un compte de la région peut être requis pour le jeu en ligne">
        <label for="compatSource">Source de la compatibilité (URL)</label><input id="compatSource" type="url">
      </fieldset>

      <fieldset><legend>Fiche du jeu</legend>
        <div class="row">
          <div><label for="genre">Genre</label><input id="genre" type="text"></div>
          <div><label for="developpeur">Développeur</label><input id="developpeur" type="text"></div>
        </div>
        <label for="sortie">Date de sortie (texte libre)</label><input id="sortie" type="text" placeholder="28 janvier 2022">
        <label for="alerte">Point d’attention (facultatif, affiché en évidence)</label><input id="alerte" type="text" placeholder="Ex. vérifier la prise secteur avant achat">
        <label for="description">Présentation originale du jeu</label>
        <textarea id="description" placeholder="Écrite par toi, sans copier de description ni de critique existante."></textarea>
        <label for="distinction">Ce qui distingue cette édition importée</label>
        <textarea id="distinction" placeholder="Langues incluses, différences avec l'édition européenne, contenu de la boîte…"></textarea>
      </fieldset>

      <fieldset><legend>Facultatif</legend>
        <div class="row">
          <div><label for="prix">Prix relevé (avec devise)</label><input id="prix" type="text" placeholder="37,99 $ US"></div>
          <div><label for="prixDate">Date du relevé</label><input id="prixDate" type="date"></div>
        </div>
        <div class="hint">Le prix n'est affiché que si la date du relevé est renseignée.</div>
        <label for="jaquette">URL de la jaquette</label><input id="jaquette" type="url">
        <div class="checks" style="margin-top:6px"><label><input id="afficherJaquette" type="checkbox"> Afficher la jaquette (seulement si l'usage est autorisé)</label></div>
      </fieldset>
    </form>

    <h2 style="margin-top:6px">Avant publication</h2>
    <ul class="checklist" id="checklist"></ul>
    <div class="bar">
      <button id="bValidate" class="primary">Valider la fiche</button>
      <button id="bValidateAll">Valider toutes les fiches complètes</button>
      <button id="bPage">Télécharger cette page</button>
      <button id="bDelete" class="danger">Supprimer</button>
    </div>
    <div id="saveMsg" class="hint"></div>
  </main>

  <section class="previewcol">
    <div class="stickybox">
      <h2 style="font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px">Aperçu de la page</h2>
      <iframe id="preview" title="Aperçu"></iframe>
    </div>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h2 style="margin-top:0;font-size:1.1rem">Réglages</h2>
    <label for="sTitre">Nom du site</label><input id="sTitre" type="text">
    <label for="sAff">Identifiant affilié Play-Asia</label><input id="sAff" type="text">
    <label for="sBase">Adresse publique du site (pour sitemap et URL canoniques)</label><input id="sBase" type="url" placeholder="https://aka-herosennin-web.github.io/import-japon/">
    <label for="sMeta">Balise de validation Search Console (code « content » uniquement)</label><input id="sMeta" type="text" placeholder="ex. AbC123…">
    <div class="checks" style="margin-top:10px"><label><input id="sNoindex" type="checkbox"> Pages en noindex (non indexées par Google)</label></div>
    <div class="bar" style="margin-top:14px;justify-content:flex-end"><button value="ok" class="primary">Fermer</button></div>
  </form>
</dialog>

<script>
(function(){
"use strict";
var KEY="generateur-fiches-import-v1";
var LANGS=["Français","Anglais","Japonais","Chinois","Allemand","Espagnol","Italien"];
var FIELDS=["type","alerte","titre","edition","console","region","format","url","languesAutres","voix","languesSource","compat","switch2","compatTexte","compatSource","genre","developpeur","sortie","description","distinction","prix","prixDate","jaquette"];

function exemple(){
  return {id:uid(),statut:"brouillon",maj:new Date().toISOString(),
    titre:"Légendes Pokémon : Arceus",edition:"Édition japonaise multilingue",console:"Nintendo Switch",region:"Japon",format:"nv",
    url:"https://www.play-asia.com/fr/pokemon-legends-arceus-multi-language/13/70e7hx",
    langues:["Français","Anglais","Japonais","Chinois","Allemand","Espagnol","Italien"],languesAutres:"Coréen, cantonais",
    languesSource:"https://www.play-asia.com/fr/pokemon-legends-arceus-multi-language/13/70e7hx",
    compat:"oui",switch2:"oui",compatTexte:"Play-Asia indique que le jeu fonctionne sur les consoles vendues dans le monde entier ; un compte de la région peut être requis pour certaines fonctions en ligne.",
    compatSource:"https://www.play-asia.com/fr/pokemon-legends-arceus-multi-language/13/70e7hx",
    genre:"Action-RPG",developpeur:"Game Freak",sortie:"28 janvier 2022",
    description:"Légendes Pokémon : Arceus se déroule à Hisui, l'ancienne région qui deviendra Sinnoh. Le joueur y parcourt de vastes zones ouvertes pour observer, capturer et étudier les Pokémon afin de constituer le tout premier Pokédex de la région. Les captures se font directement dans le décor, et les combats restent au tour par tour.",
    distinction:"Cette édition est vendue au Japon, mais Play-Asia y indique le français parmi les langues disponibles : pas besoin de l'édition européenne pour jouer en français.",
    prix:"",prixDate:"",jaquette:"",afficherJaquette:false};
}
function uid(){return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

var state={settings:{titre:"Jeux japonais en français",aff:"971294",noindex:true,base:"",meta:""},fiches:[],current:null};
try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&Array.isArray(s.fiches))state=Object.assign(state,s);}}catch(e){}
if(!state.fiches.length){state.fiches.push(exemple());}
if(!state.current||!byId(state.current))state.current=state.fiches[0].id;

function byId(id){for(var i=0;i<state.fiches.length;i++)if(state.fiches[i].id===id)return state.fiches[i];return null}
function cur(){return byId(state.current)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));msg("Enregistré automatiquement dans ce navigateur.")}catch(e){msg("Sauvegarde locale impossible : pense à « Sauvegarder (JSON) ».")}}
function msg(t){document.getElementById("saveMsg").textContent=t}
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function isUrl(v){try{var u=new URL(v);return u.protocol==="https:"||u.protocol==="http:"}catch(e){return false}}
function slug(f){var ed=f.edition||"",co=f.console||"";if(ed.toLowerCase().indexOf(co.toLowerCase())>-1||(f.type&&f.type!=="jeu"))co="";if(/\bps5\b/i.test(ed)&&co==="PlayStation 5")co="";if(/\bps4\b/i.test(ed)&&co==="PlayStation 4")co="";return ((f.titre||"jeu")+" "+ed+" "+co).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,140).replace(/-$/,"")||"fiche"}
function frDate(iso){if(!iso)return"";var p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso}

/* ---------- lien affilié ---------- */
function analyseLien(v){
  var aff=String(state.settings.aff||"").trim();
  if(!v)return{etat:"vide"};
  var u;try{u=new URL(v)}catch(e){return{etat:"invalide"}}
  if(!/(^|\.)play-asia\.com$/i.test(u.hostname))return{etat:"domaine"};
  var t=u.searchParams.get("tagid"),a2=u.searchParams.get("affiliate_id");
  if(t===null&&a2===null)return{etat:"manquant",url:u};
  if((t!==null&&t!==aff)||(a2!==null&&a2!==aff))return{etat:"autre",tag:t!==null?t:a2};
  return{etat:"ok"};
}
function renderUrlMsg(){
  var f=cur(),a=analyseLien(f.url),box=$("urlMsg");
  var html="";
  if(a.etat==="ok")html='<div class="msg ok">Identifiant affilié présent ('+esc(state.settings.aff)+') : lien conservé tel quel.</div>';
  else if(a.etat==="manquant")html='<div class="msg warn">Ce lien ne contient pas ton identifiant. Le mieux : copier le lien généré par ton tableau de bord Play-Asia. <button type="button" id="bAddTag">Ajouter tagid='+esc(state.settings.aff)+'</button></div>';
  else if(a.etat==="autre")html='<div class="msg ko">Ce lien contient un autre identifiant (tagid='+esc(a.tag)+'). Il ne sera pas accepté.</div>';
  else if(a.etat==="domaine")html='<div class="msg ko">Ce n’est pas un lien play-asia.com.</div>';
  else if(a.etat==="invalide")html='<div class="msg ko">Adresse invalide.</div>';
  if(box.dataset.html===html)return;   /* évite de recréer le bouton pendant un clic */
  box.dataset.html=html;box.innerHTML=html;
  var b=$("bAddTag");if(b)b.onclick=function(){var c=cur(),u=new URL(c.url);u.searchParams.set("tagid",state.settings.aff);c.url=u.toString();$("url").value=c.url;changed();};
}

/* ---------- validation ---------- */
function controles(f){
  var a=analyseLien(f.url);
  var langs=(f.langues||[]).length||(f.languesAutres||"").trim();
  if(f.type&&f.type!=="jeu")return [
    ["Titre et description courte renseignés",!!(f.titre&&f.edition)],
    ["Lien Play-Asia avec ton identifiant affilié",a.etat==="ok"],
    ["Source (URL de la fiche Play-Asia)",isUrl(f.compatSource)||isUrl(f.languesSource)],
    ["Présentation originale (≥ 200 caractères)",(f.description||"").trim().length>=200],
    ["Points à connaître (≥ 60 caractères)",(f.distinction||"").trim().length>=60]
  ];
  return [
    ["Titre et édition renseignés",!!(f.titre&&f.edition)],
    ["Lien Play-Asia avec ton identifiant affilié",a.etat==="ok"],
    ["Format renseigné (ou « non précisé par Play-Asia »)",f.format!=="nv"],
    ["Langues cochées",!!langs],
    ["Source des langues (URL valide)",isUrl(f.languesSource)],
    ["Compatibilité console européenne renseignée",f.compat!=="nv"],
    ["Compatibilité Switch 2 vérifiée ou sans objet",f.switch2!=="nv"],
    ["Source de la compatibilité (URL valide)",isUrl(f.compatSource)],
    ["Présentation originale (≥ 200 caractères)",(f.description||"").trim().length>=200],
    ["Ce qui distingue l'édition (≥ 60 caractères)",(f.distinction||"").trim().length>=60]
  ];
}
function pret(f){return controles(f).every(function(c){return c[1]})}

/* ---------- génération des pages ---------- */
var PAGE_CSS=":root{--bg:#f6f5f2;--surface:#fff;--ink:#1d1d1f;--muted:#5f6368;--line:#e3e1dc;--accent:#c0392b;--ok:#1e7a46;--ok-bg:#e8f5ed;--ko:#9a3412;--ko-bg:#fdeee6;--warn-bg:#fff7e6;--warn-line:#f0c36d}"
+"@media (prefers-color-scheme:dark){:root{--bg:#141414;--surface:#1e1e1f;--ink:#f2f2f2;--muted:#a3a3a3;--line:#333;--accent:#e2574c;--ok:#4ade80;--ok-bg:#15291d;--ko:#fb923c;--ko-bg:#2d1c12;--warn-bg:#2b2416;--warn-line:#8a6d2b}}"
+"*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}a{color:inherit}"
+".wrap{max-width:860px;margin:0 auto;padding:0 16px}header{background:var(--surface);border-bottom:1px solid var(--line)}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}"
+".brand{font-weight:700;text-decoration:none}.brand span{color:var(--accent)}nav a{color:var(--muted);text-decoration:none;font-size:.9rem}"
+"main{padding:28px 0 36px}h1{font-size:clamp(1.45rem,4vw,2rem);line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}.sub{color:var(--muted);margin:0 0 20px}"
+".answer{display:grid;gap:8px;margin:0 0 22px}.ans{border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}.ans strong{display:block;font-size:1.05rem}"
+".ans.ok{background:var(--ok-bg);border-color:transparent}.ans.ok strong{color:var(--ok)}.ans.ko{background:var(--ko-bg);border-color:transparent}.ans.ko strong{color:var(--ko)}"
+".cover{float:right;max-width:200px;margin:0 0 12px 18px}.cover img{width:100%;border-radius:8px;display:block}.cover figcaption{font-size:.75rem;color:var(--muted)}"
+"h2{font-size:1.15rem;margin:26px 0 8px}h3{font-size:1rem;margin:16px 0 4px}table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{text-align:left;padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:500;color:var(--muted);width:42%;padding-right:12px}"
+".warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:12px 14px;font-size:.92rem;margin:20px 0}"
+".btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:11px 16px;border-radius:10px}.small{font-size:.85rem;color:var(--muted)}"
+".sources li{margin:3px 0;word-break:break-all}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none}"
+".card small{display:block;color:var(--muted)}.thumb{width:100%;height:150px;object-fit:contain;background:var(--bg);border-radius:8px;margin-bottom:8px;display:block}.pill{display:inline-block;font-size:.78rem;border-radius:6px;padding:1px 8px;margin-top:6px}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.ko{background:var(--ko-bg);color:var(--ko)}"
+"footer{background:var(--surface);border-top:1px solid var(--line);padding:16px 0 26px;font-size:.84rem;color:var(--muted)}";

function baseUrl(){var b=String(state.settings.base||"").trim();if(!b)return"";return b.replace(/\/?$/,"/")}
function shell(title,desc,body,depth,path){
  var up=depth?"../":"";var b=baseUrl();

function fillForm(){
  var f=cur();
  FIELDS.forEach(function(k){$(k).value=f[k]==null?"":f[k]});
  $("afficherJaquette").checked=!!f.afficherJaquette;
  if(!$("type").value)$("type").value="jeu";
  [].forEach.call(langBox.querySelectorAll("input"),function(i){i.checked=(f.langues||[]).indexOf(i.value)>-1});
  refresh();
}
function readForm(){
  var f=cur();
  FIELDS.forEach(function(k){f[k]=$(k).value});
  f.afficherJaquette=$("afficherJaquette").checked;
  f.langues=[].filter.call(langBox.querySelectorAll("input"),function(i){return i.checked}).map(function(i){return i.value});
}
var timer=null;

  readForm();var f=cur();
  if(f.statut==="validee"){f.statut="brouillon";msg("Fiche modifiée : elle repasse en brouillon jusqu’à nouvelle validation.")}

  refresh();clearTimeout(timer);timer=setTimeout(save,400);
}
function refresh(){
  var f=cur();

function download(name,content,type){
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type:type||"text/html"}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

$("form").addEventListener("input",changed);
$("form").addEventListener("change",changed);
$("bNew").onclick=function(){var f=exemple();FIELDS.forEach(function(k){f[k]=""});f.console="Nintendo Switch";f.region="Japon";f.format="nv";f.compat="nv";f.switch2="na";f.langues=[];f.titre="";state.fiches.unshift(f);state.current=f.id;save();fillForm();$("titre").focus()};
$("bDelete").onclick=function(){var f=cur();if(!confirm("Supprimer la fiche « "+(f.titre||"Sans titre")+" » ?"))return;state.fiches=state.fiches.filter(function(x){return x.id!==f.id});if(!state.fiches.length)state.fiches.push(exemple());state.current=state.fiches[0].id;save();fillForm()};
$("bValidate").onclick=function(){var f=cur();if(!pret(f))return;f.statut="validee";save();refresh();msg("Fiche validée : elle sera incluse dans l’export du site.")};
$("bValidateAll").onclick=function(){var todo=state.fiches.filter(function(f){return f.statut!=="validee"&&pret(f)});if(!todo.length){alert("Aucune fiche complète en attente.");return}if(!confirm(todo.length+" fiche(s) complète(s) vont être validées. Les as-tu relues ?"))return;todo.forEach(function(f){f.statut="validee"});save();refresh();msg(todo.length+" fiche(s) validée(s).")};
$("bPage").onclick=function(){var f=cur();download(slug(f)+".html",pageFiche(f))};
$("bExportJson").onclick=function(){download("fiches-import-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(state,null,2),"application/json")};
$("fImport").onchange=function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var s=JSON.parse(r.result);if(!Array.isArray(s.fiches))throw 0;if(s.settings){if(!state.settings.base&&s.settings.base)state.settings.base=s.settings.base;}var known={},n=0,u=0,k=0;state.fiches.forEach(function(x,i){known[x.id]=i});s.fiches.forEach(function(x){if(!(x.id in known)){state.fiches.push(x);n++;return}var old=state.fiches[known[x.id]];if(old.statut!=="validee"){state.fiches[known[x.id]]=x;u++}else{if(!old.jaquette&&x.jaquette){old.jaquette=x.jaquette;old.afficherJaquette=x.afficherJaquette}k++}});if(s.fiches[0])state.current=s.fiches[0].id;save();fillForm();msg(n+" ajoutée(s), "+u+" brouillon(s) mis à jour, "+k+" fiche(s) validée(s) conservée(s).")}catch(err){alert("Fichier non reconnu.")}};r.readAsText(file);e.target.value=""};
$("bExportSite").onclick=function(){
  var ok=state.fiches.filter(function(f){return f.statut==="validee"&&pret(f)});
  if(!ok.length){alert("Aucune fiche validée : valide au moins une fiche avant d’exporter.");return}
  if(typeof JSZip==="undefined"){alert("L’export .zip nécessite une connexion internet (bibliothèque JSZip). Utilise « Télécharger cette page » en attendant.");return}
  var z=new JSZip();z.file("index.html",pageIndex(ok));z.file("a-propos.html",pageAbout());z.file("commander-play-asia.html",pageGuide(ok));
  ok.forEach(function(f){z.file("jeux/"+slug(f)+".html",pageFiche(f))});
  var b=baseUrl();
  if(b&&!state.settings.noindex){var today=new Date().toISOString().slice(0,10);
    var urls=["","commander-play-asia.html","a-propos.html"].concat(ok.map(function(f){return "jeux/"+slug(f)+".html"}));
    z.file("sitemap.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+urls.map(function(u){return "  <url><loc>"+esc(b+u)+"</loc><lastmod>"+today+"</lastmod></url>"}).join("\n")+"\n</urlset>\n");
    z.file("robots.txt","User-agent: *\nAllow: /\nSitemap: "+b+"sitemap.xml\n");
    z.file(".nojekyll","");
  } else if(!state.settings.noindex){alert("Indique l’adresse publique du site dans Réglages pour générer le sitemap.");}
  /* contrôle des liens internes avant téléchargement */
  var broken=[];
  var pages={};Object.keys(z.files).forEach(function(n){pages[n]=1});
  var srcs={"index.html":pageIndex(ok),"a-propos.html":pageAbout(),"commander-play-asia.html":pageGuide(ok)};ok.forEach(function(f){srcs["jeux/"+slug(f)+".html"]=pageFiche(f)});
  Object.keys(srcs).forEach(function(name){var dir=name.indexOf("/")>-1?name.replace(/[^\/]+$/,""):"";
    (srcs[name].match(/href="([^"#]+)"/g)||[]).forEach(function(m){var h=m.slice(6,-1);if(/^(https?:|mailto:)/.test(h))return;
      var parts=(dir+h).split("/"),out=[];parts.forEach(function(x){if(x==="..")out.pop();else if(x&&x!==".")out.push(x)});var t=out.join("/");
      if(!pages[t])broken.push(name+" → "+h)})});
  if(broken.length){alert("Export annulé : liens internes cassés\n"+broken.join("\n"));return}
  z.generateAsync({type:"blob"}).then(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="site-jeux-import.zip";a.click();msg(ok.length+" fiche(s) validée(s) exportée(s), liens internes vérifiés.")});
};
$("bSettings").onclick=function(){$("sTitre").value=state.settings.titre;$("sAff").value=state.settings.aff;$("sNoindex").checked=!!state.settings.noindex;$("sBase").value=state.settings.base||"";$("sMeta").value=state.settings.meta||"";$("dlg").showModal()};
$("dlg").addEventListener("close",function(){state.settings.titre=$("sTitre").value.trim()||"Jeux japonais en français";state.settings.aff=$("sAff").value.trim()||"971294";state.settings.noindex=$("sNoindex").checked;state.settings.base=$("sBase").value.trim();state.settings.meta=$("sMeta").value.trim().replace(/^.*content="([^"]+)".*$/,"$1");save();refresh()});

fillForm();
})();
</script>
</body>
